<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesli Asistan Denemesi</title>
<style>
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --text: #17211d;
    --muted: #5d6b65;
    --line: #d9e0dc;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --live: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121816;
      --surface: #1a2220;
      --text: #e8efeb;
      --muted: #93a39b;
      --line: #2c3834;
      --accent: #3fb59a;
      --accent-ink: #0b1411;
      --live: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px 28px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin: 0 0 8px; font-weight: 650; }
  p.lead { margin: 0 0 28px; color: var(--muted); line-height: 1.5; }

  .orb {
    width: 96px; height: 96px; border-radius: 50%;
    margin: 0 auto 24px;
    background: var(--line);
    transition: background .3s;
  }
  .orb.live { background: var(--accent); }
  .orb.speaking { animation: pulse 1s ease-in-out infinite; background: var(--live); }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb.speaking { animation: none; }
  }

  label { display: block; text-align: left; font-size: .9rem; margin-bottom: 6px; color: var(--muted); }
  input {
    width: 100%; padding: 12px 14px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); margin-bottom: 16px;
  }
  button {
    width: 100%; padding: 14px; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .6; cursor: default; }
  button.stop { background: var(--live); color: #fff; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #status { min-height: 1.4em; margin-top: 16px; font-size: .95rem; color: var(--muted); }
  #status.error { color: var(--live); }
</style>
</head>
<body>
<main>
  <div class="orb" id="orb" aria-hidden="true"></div>
  <h1>Sesli asistanı deneyin</h1>
  <p class="lead">Başlattığınızda mikrofon izni istenecek. Asistanla normal bir telefon görüşmesi gibi konuşabilirsiniz.</p>

  <label for="code">Giriş kodu</label>
  <input id="code" type="password" autocomplete="off" placeholder="Size verilen kod">

  <button id="btn">Konuşmayı başlat</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script type="module">
  import { RetellWebClient } from "https://esm.sh/retell-client-js-sdk";

  const API_URL = "/api/create-call";

  const client = new RetellWebClient();
  const btn = document.getElementById("btn");
  const orb = document.getElementById("orb");
  const statusEl = document.getElementById("status");
  const codeEl = document.getElementById("code");
  let inCall = false;

  function setStatus(text, isError = false) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  function setCallUI(active) {
    inCall = active;
    btn.disabled = false;
    btn.textContent = active ? "Görüşmeyi bitir" : "Konuşmayı başlat";
    btn.classList.toggle("stop", active);
    orb.classList.toggle("live", active);
    if (!active) orb.classList.remove("speaking");
    codeEl.disabled = active;
  }

  client.on("call_started", () => { setCallUI(true); setStatus("Bağlandı, konuşabilirsiniz."); });
  client.on("call_ended", () => { setCallUI(false); setStatus("Görüşme sona erdi."); });
  client.on("agent_start_talking", () => orb.classList.add("speaking"));
  client.on("agent_stop_talking", () => orb.classList.remove("speaking"));
  client.on("error", (err) => {
    console.error(err);
    client.stopCall();
    setCallUI(false);
    setStatus("Bir hata oluştu. Mikrofon iznini kontrol edip tekrar deneyin.", true);
  });

  btn.addEventListener("click", async () => {
    if (inCall) { client.stopCall(); return; }

    const code = codeEl.value.trim();
    if (!code) { setStatus("Önce giriş kodunu girin.", true); return; }

    btn.disabled = true;
    setStatus("Bağlanıyor…");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Bağlantı kurulamadı");

      await client.startCall({ accessToken: data.accessToken });
    } catch (e) {
      btn.disabled = false;
      setStatus(e.message, true);
    }
  });
</script>
</body>
</html>
