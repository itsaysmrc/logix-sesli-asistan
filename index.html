<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesli Asistan Denemesi</title>
<style>
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --text: #17211d;
    --muted: #5d6b65;
    --line: #d9e0dc;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --live: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121816;
      --surface: #1a2220;
      --text: #e8efeb;
      --muted: #93a39b;
      --line: #2c3834;
      --accent: #3fb59a;
      --accent-ink: #0b1411;
      --live: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px 28px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin: 0 0 8px; font-weight: 650; }
  p.lead { margin: 0 0 28px; color: var(--muted); line-height: 1.5; }

  .orb {
    width: 96px; height: 96px; border-radius: 50%;
    margin: 0 auto 24px;
    background: var(--line);
    transition: background .3s;
  }
  .orb.connecting { background: var(--muted); }
  .orb.live { background: var(--accent); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb.live { animation: none; }
  }

  button {
    width: 100%; padding: 14px; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .6; cursor: default; }
  button.stop { background: var(--live); color: #fff; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #status { min-height: 1.4em; margin-top: 16px; font-size: .95rem; color: var(--muted); }
  #status.error { color: var(--live); }
</style>
</head>
<body>
<main>
  <div class="orb" id="orb" aria-hidden="true"></div>
  <h1>Sesli asistanı deneyin</h1>
  <p class="lead">Başlattığınızda mikrofon izni istenecek. Asistanla normal bir telefon görüşmesi gibi konuşabilirsiniz.</p>

  <button id="btn">Konuşmayı başlat</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script type="module">
  import { RetellClient } from "https://esm.sh/retell-client-js-sdk";

  // Retell panelinden aldığın PUBLIC key ve agent ID'yi yaz.
  const PUBLIC_KEY = "public_key_2999955df9cd4899556c9";
  const AGENT_ID = "agent_068cdcacd897a0435200337e5a";

  const client = new RetellClient({ key: PUBLIC_KEY });
  const btn = document.getElementById("btn");
  const orb = document.getElementById("orb");
  const statusEl = document.getElementById("status");
  let call = null;

  function setStatus(text, isError = false) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  function setUI(state) {
    orb.className = "orb" + (state === "idle" ? "" : " " + state);
    btn.disabled = state === "connecting";
    btn.classList.toggle("stop", state === "live");
    btn.textContent = state === "live" ? "Görüşmeyi bitir" : "Konuşmayı başlat";
  }

  btn.addEventListener("click", async () => {
    if (call && call.status !== "ended") {
      await call.end();
      return;
    }

    setUI("connecting");
    setStatus("Bağlanıyor…");

    call = client.createWebCall({
      agent_id: AGENT_ID,
      hooks: {
        onStatus: (status) => {
          if (status === "live") { setUI("live"); setStatus("Bağlandı, konuşabilirsiniz."); }
        },
        onEnd: () => { setUI("idle"); if (!statusEl.classList.contains("error")) setStatus("Görüşme sona erdi."); },
        onError: (err) => {
          console.error(err);
          setUI("idle");
          setStatus("Bağlantı kurulamadı. Mikrofon iznini kontrol edip tekrar deneyin.", true);
        },
      },
    });
  });
</script>
</body>
</html>
